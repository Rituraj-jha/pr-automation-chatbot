# ─── ENT/FUNC Delegate Knowledge Base ────────────────────────────────────────
# Source: Enterprise / Functional Group Delegates Matrix
#
# Fields:
#   code                    : canonical ENT/FUNC identifier (e.g. AGTR_EMEA)
#   label                   : human-readable group name
#   data_leader             : Data & Analytics Leader / Data Owner
#   fte_delegate_data_access: FTE Delegate (Data Access) — cross-functional only
#   fte_db_owner_raw        : FTE Database Owner — Raw (new DB creation only)
#   fte_db_owner_curated    : FTE Database Owner — Curated & Serving (new DB creation only)
#
# All name fields are case-normalized to "Firstname Lastname" for fuzzy matching.
# Empty string means the role is currently unassigned.
# ─────────────────────────────────────────────────────────────────────────────

