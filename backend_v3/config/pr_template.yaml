# PR Template Configuration
# Defines intake questions, auto-fill strategies, labels, and body formatting.
# Used by: pr_tools.py (create_pr), system.md (LLM guidance), frontend (PR form).

# Intake questions — prepared before PR creation
# auto_fill: strategy to derive answer without asking (null = ask unless default is present)
intake_questions:
  - id: objective
    question: "What is the objective of this request?"
    required: true
    auto_fill:
      strategy: derive_from_resources
      template: "Provision {resource_count} {resource_types} for {enterprise} in {plat_env}"
    example: "Provision S3 source bucket and Glue database for AGTR APAC in production"

  - id: data_flow_or_usage_pattern
    question: "What is the data flow or usage pattern (batch / streaming / hybrid / ad-hoc)?"
    required: true
    auto_fill: null
    example: "Batch ingestion"

  - id: priority_timeline
    question: "What is the priority and timeline for this request? Are you aware of MIW's SLA of 72 hours?"
    required: true
    auto_fill: null
    example: "High priority; aware of MIW's 72-hour SLA"

  - id: intake_ready_and_naming
    question: "Has the intake request been approved and is it in Ready for Design state? Have you followed MIW naming conventions?"
    required: true
    auto_fill: null
    example: "Yes, intake is approved/Ready for Design and naming conventions have been followed"

  - id: compute_access_requirements
    question: "What are the compute and access requirements (size recommendations, entitlements/roles, access mode)?"
    required: true
    auto_fill: null
    example: "Small; standard data consumer role access"

  - id: dependencies_risks
    question: "Are there any dependencies, risks, or special considerations we should know before approving this request?"
    required: true
    auto_fill: null
    default: "No known dependencies, risks, or special considerations."
    example: "No"

# Labels applied to PR
# derive: how to compute label value from session context
# ask: if derive fails, ask user
labels:
  - prefix: "ENV"
    derive:
      strategy: from_resource_field
      field: plat_env
      transform: null  # value is already dev/prd
    values: [dev, prd, snd]
    required: true

  - prefix: "Enterprise/Function"
    derive:
      strategy: combine_resource_fields
      fields: [enterprise_or_func_name, enterprise_or_func_subgrp_name]
      separator: "-"
      skip_empty_parts: true
    required: true

  - prefix: "Wave"
    derive: null  # always ask
    ask: "Which wave does this belong to?"
    values: [W0, W1, W1.1, W1.2, W2.1, W2.2]
    session_reuse: true  # remember within session
    required: true

  # Static label — always applied, never asked
  - name: "CREATED_BY:MiNi"
    static: true
    required: true

# PR body template (Markdown)
# Placeholders: {intake_answers.*}, {resource_summary}, {labels_list}
body_template: |
