# MiNi Agent — Pre-validation Gates
# Central config for validations that must pass before certain resources can be created.

# Data Owner Approval validation.
# For now this is mocked in tools/intake_tools.py, but this config is the source of truth
# for which resources require approval and what file types the frontend should accept.
data_owner_approval:
  enabled: true
  mock: true
  validator_tool: validate_data_owner_approval_document
  resources:
    - glue_db
  accepted_file_types:
    - image/png
    - image/jpeg
    - image/jpg
    - application/pdf
  description: "Upload a data owner approval screenshot or PDF. PDFs will be converted to images before real image analysis is added."
