# MiNi Agent — Pre-validation Gates
# Central config for validations that must pass before certain resources can be created.

# Data Owner Approval validation.
# Enhanced reviewer uses OpenAI vision + knowledge base validation.
# Enable/disable enhanced reviewer in settings.yaml (approval_reviewer.enhanced_reviewer_enabled).
data_owner_approval:
  enabled: true
  mock: false
  validator_tool: validate_data_owner_approval_document
  resources:
    - glue_db
  accepted_file_types:
    - image/png
    - image/jpeg
    - image/jpg
    - application/pdf
  description: "Upload a data owner approval screenshot or PDF. The system will extract and validate: approver name, approval date, source system, and business justification."
