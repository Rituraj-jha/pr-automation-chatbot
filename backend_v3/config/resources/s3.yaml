# S3 Bucket — Resource Configuration
# Tools read this for field specs, derivation rules, and YAML generation.

resource_type: s3
display_name: "S3 Bucket"
description: "S3 storage bucket for Minerva data lake"
file_name_field: bucket_name

# Pre-validation gates (s3 does not require data owner approval)
pre_validations: []

# Fields the user provides
collect_fields:
  - name: plat_env
    label: "Environment"
    description: "Target platform environment"
    group: identity
    session_reuse: true
    required: true
    options:
      - value: dev
        label: Dev
        description: "Development / testing"
      - value: prd
        label: Prod
        description: "Production"
    normalize:
      development: dev
      production: prd
      prod: prd
      develop: dev
      devlopment: dev
      developmnt: dev
      prodction: prd
      prodution: prd

  - name: intake_id
    label: "Intake ID"
    description: "Request tracking ID (e.g. M0000485)"
    group: identity
    session_reuse: false
    required: true
    placeholder: "e.g. M021213"
    validation: "^[MI]\\d+$"

  - name: usage_type
    label: "Usage Type"
    description: "Purpose category of the bucket"
    group: s3_specific
    session_reuse: false
    required: true
    options:
      - value: Source
        label: Source
        description: "Raw data ingestion from external systems"
      - value: DataProduct
        label: Data Product
        description: "Curated data for consumption"
      - value: Scripts
        label: Scripts
        description: "ETL/processing scripts and code"
      - value: EngAssets
        label: Eng Assets
        description: "Engineering artifacts and configs"
      - value: Ops
        label: Operations
        description: "Ad-hoc operational data, reports, and safeguards"
    normalize:
      source: Source
      src: Source
      raw: Source
      ingestion: Source
      ingest: Source
      source bucket: Source
      raw bucket: Source
      ingestion bucket: Source
      sorce: Source
      dataproduct: DataProduct
      data product: DataProduct
      data products: DataProduct
      dp: DataProduct
      curated: DataProduct
      serving: DataProduct
      consumption: DataProduct
      data prodct: DataProduct
      scripts: Scripts
      script: Scripts
      script bucket: Scripts
      scrpts: Scripts
      engassets: EngAssets
      eng assets: EngAssets
      eng-assets: EngAssets
      engineering assets: EngAssets
      engineering asset: EngAssets
      eng asset: EngAssets
      eng assests: EngAssets
      ops: Ops
      operations: Ops
      operational: Ops
      operation: Ops
      ad hoc: Ops
      ad-hoc: Ops
      reports: Ops
      csv dumps: Ops

  - name: account_association
    label: "Account Association"
    description: "Whether this S3 bucket should be derived for Lakehouse or Compute when the usage type allows either. Source implies Lakehouse; DataProduct implies Compute."
    group: s3_naming
    session_reuse: false
    required: false
    options:
      - value: Lakehouse
        label: Lakehouse
        description: "Lakehouse account naming grain"
      - value: Compute
        label: Compute
        description: "Compute account naming grain"
    normalize:
      lakehouse: Lakehouse
      lake house: Lakehouse
      lh: Lakehouse
      lh1: Lakehouse
      compute: Compute
      cmp: Compute
      cmp1: Compute
      cmp2: Compute
      cmp3: Compute
      cmp4: Compute

  - name: source_system_name
    label: "Source System Name"
    description: "Source-system token for approved source-system-specific Lakehouse buckets, such as sap."
    group: s3_naming
    session_reuse: false
    required: false
    normalize_case: lower
    validation: "^[a-z0-9][a-z0-9_-]*$"

  - name: ops_identifier
    label: "Operations Identifier"
    description: "Optional extra operations token for ops buckets when examples require it, such as miw in dtd-miw-ops."
    group: s3_naming
    session_reuse: false
    required: false
    normalize_case: lower
    validation: "^[a-z0-9][a-z0-9_-]*$"

  - name: enterprise_or_func_name
    label: "Enterprise"
    description: "Enterprise or functional area"
    group: identity
    session_reuse: true
    required: true
    options:
      - value: AGTR
        label: AGTR
        description: "Agriculture & Trading"
      - value: CORP
        label: CORP
        description: "Corporate"
      - value: FOOD
        label: FOOD
        description: "Food & Bio Industrial"
      - value: SPEC
        label: SPEC
        description: "Specialized Nutrition"
    normalize:
      agtr: AGTR
      ag trading: AGTR
      agriculture trading: AGTR
      agriculture and trading: AGTR
      "ag & trading": AGTR
      ag tradng: AGTR
      corp: CORP
      corporate: CORP
      corprate: CORP
      food: FOOD
      food and bio: FOOD
      food bio industrial: FOOD
      food bioindustrial: FOOD
      spec: SPEC
      specialized: SPEC
      specialised: SPEC
      specialized nutrition: SPEC
      spcialized: SPEC

  - name: enterprise_or_func_subgrp_name
    label: "Subgroup"
    description: "Subgroup within the enterprise (e.g. APAC, FIN). Can be empty."
    group: identity
    session_reuse: true
    depends_on: enterprise_or_func_name
    required: true
    allow_empty: true
    placeholder: "e.g. APAC, FIN, PRGL (or leave empty)"
    required_when: "enterprise_or_func_name == CORP"
    normalize_case: upper

# Fields derived automatically (never ask user)
derive_fields:
  - name: bucket_name
    label: "Bucket Name"
    description: "DNS-compliant S3 bucket name"
    editable: constrained
    validation: "^[a-z0-9][a-z0-9\\-]{2,62}$"

  - name: bucket_description
    label: "Bucket Description"
    description: "Human-readable purpose of the bucket"
    editable: free
    max_length: 256

  - name: aws_account_id
    label: "AWS Account ID"
    description: "12-digit AWS account ID"
    editable: locked

  - name: aws_region
    label: "AWS Region"
    auto_value: "us-east-1"
    editable: locked

# Derivation logic (used by derive tool)
derivation:
  bucket_name:
    pattern: "{plat_env}-{acct_abbr}-{entity}[-{subgrp}]-{suffix}"
    segments:
      plat_env: "from account abbreviation (dev or prd)"
      acct_abbr: "from account lookup (lh1, cmp1..cmp4)"
      entity: "lowercase(enterprise_or_func_name)"
      subgrp: "lowercase(subgrp) — omit segment if empty"
      suffix: "Source→src, DataProduct→dp, Scripts→scripts, EngAssets→eng-assets, Ops→ops"
    suffix_map:
      Source: src
      DataProduct: dp
      Scripts: scripts
      EngAssets: eng-assets
      Ops: ops

  aws_account_id:
    rules:
      - condition: "usage_type == Source"
        resolve: "lakehouse account for the target plat_env"
        default_plat_env: prd
      - condition: "usage_type == DataProduct"
        resolve: "compute account matching enterprise"
        default_plat_env: prd
      - condition: "usage_type in [Scripts, EngAssets]"
        resolve: "use account_association when supplied; if missing, LLM derivation should ask for Lakehouse or Compute"
        default_plat_env: prd
      - condition: "usage_type == Ops"
        resolve: "use account_association when supplied; if missing, LLM derivation should ask for Lakehouse or Compute"
        default_plat_env: prd

  bucket_description:
    template: "{usage_type} bucket for {enterprise} {subgrp}"

# YAML output rules
yaml_output:
  field_order:
    - intake_id
    - bucket_name
    - bucket_description
    - aws_account_id
    - aws_region
    - usage_type
    - enterprise_or_func_name
    - enterprise_or_func_subgrp_name
    - versioning_enabled  # only if Scripts

  quoting:
    aws_account_id: single  # '578647603827'
    bucket_description: double_if_spaces
    enterprise_or_func_subgrp_name: double_if_empty  # ""
    default: none

  conditional_fields:
    - field: versioning_enabled
      include_when: "usage_type == Scripts"
      value: true

# Account constraints (which usage_type goes with which account type)
# Used by derive_tools for account resolution + reviewer for validation
constraints:
  usage_type_account:
    Source: lakehouse
    DataProduct: compute
    Scripts: lakehouse
    EngAssets: lakehouse
    Ops: lakehouse_or_compute

# Validations run after derivation (reviewer uses these)
validations:
  - name: bucket_name_format
    type: regex
    check_field: bucket_name
    pattern: "^[a-z0-9][a-z0-9\\-]{2,62}$"
    error: "Bucket name must be DNS-compliant lowercase with hyphens only"

  - name: enterprise_in_name
    type: contains
    check_field: bucket_name
    must_contain_field: enterprise_or_func_name
    transform: lower
    error: "Bucket name must contain the enterprise abbreviation"

  - name: suffix_matches_usage
    type: ends_with
    check_field: bucket_name
    suffix_from: derivation.bucket_name.suffix_map
    key_field: usage_type
    error: "Bucket name suffix must match usage_type (src/dp/scripts/eng-assets/ops)"

  - name: subgrp_for_corp
    type: required_if
    field: enterprise_or_func_subgrp_name
    when: "enterprise_or_func_name == CORP"
    error: "CORP enterprise requires a subgroup"

  - name: account_matches_usage
    type: account_type_check
    check_field: aws_account_id
    expected_type_from: constraints.usage_type_account
    key_field: usage_type
    error: "Account ID doesn't match expected account type for this usage_type"
