# MiNi Agent — Application Settings
# Only keys actually consumed by agent code live here.
# LLM config comes from .env (TRUEFOUNDRY_API_KEY, MODEL_NAME, etc.)
# DB path is hardcoded in api.py. Agent max iterations is hardcoded in loop.py.

# Supported resource types — agent uses this for intent classification
supported_resources:
  - type: s3
    display: "S3 Bucket"
    aliases: [bucket, s3 bucket, storage, s3, object storage, s3 storage]
  - type: glue_db
    display: "Glue Database"
    aliases: [database, glue database, gluedb, glue db, catalog, glue catalog, db]
  # - type: iam
  #   display: "IAM Role"
  #   aliases: [role, iam role, permissions, access role]

# Message when user asks for unsupported resource
unsupported_message: |
  I can currently help provision these resources:
  • **S3 Buckets** — storage for data lake
  • **Glue Databases** — catalog for lakehouse/compute

  Would you like to create one of these?

# Intake ID validation settings
intake_validation:
  enabled: true
  format_regex: "^[MI]\\d+$"
  external_api: null  # future: URL to intake tracking system for status lookup
  allow_proceed_on_not_found: true
